name: Quality and container
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/setup@v2.1.0
        with:
          runtime: node@24
          require-lockfile: true
          cache: true
      - run: pnpm check
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: browser-evidence
          path: |
            playwright-report/
            test-results/
            docs/screenshots/
          retention-days: 14
  image:
    needs: quality
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.3.0
      - uses: docker/build-push-action@v7.3.0
        with:
          context: .
          load: true
          tags: leo-agent-manager:test
          build-args: VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: node tests/container-smoke.mjs
      - uses: docker/login-action@v4.6.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6.2.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v7.3.0
        id: publish
        if: github.event_name != 'pull_request'
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VCS_REF=${{ github.sha }}
          cache-from: type=gha
          provenance: mode=max
          sbom: true
  deploy:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ vars.LEO_PUBLIC_URL }}
    concurrency:
      group: coolify-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/setup@v2.1.0
        with:
          runtime: node@24
          require-lockfile: true
          install: false
      - name: Deploy the published image and verify the running commit
        env:
          COOLIFY_URL: ${{ vars.COOLIFY_URL }}
          COOLIFY_SERVICE_UUID: ${{ vars.COOLIFY_SERVICE_UUID }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          LEO_PUBLIC_URL: ${{ vars.LEO_PUBLIC_URL }}
          DEPLOY_IMAGE: ghcr.io/${{ github.repository }}@${{ needs.image.outputs.digest }}
          DEPLOY_COMMIT: ${{ github.sha }}
        run: node scripts/deploy-coolify.mjs
