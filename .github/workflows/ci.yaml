name: Quality and container
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    permissions:
      contents: read
      actions: read
    outputs:
      reuse: ${{ steps.resolve.outputs.reuse }}
      digest: ${{ steps.resolve.outputs.digest }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/setup@v2.1.0
        with:
          runtime: node@24
          require-lockfile: true
          install: false
      - id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/resolve-release.mjs
  quality:
    needs: resolve
    if: needs.resolve.outputs.reuse != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/setup@v2.1.0
        with:
          runtime: node@24
          require-lockfile: true
          cache: true
      - run: pnpm check
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: browser-evidence
          path: |
            playwright-report/
            test-results/
            docs/screenshots/
          retention-days: 14
  image:
    needs: [resolve, quality]
    if: needs.resolve.outputs.reuse != 'true'
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.3.0
      - uses: docker/build-push-action@v7.3.0
        with:
          context: .
          load: true
          tags: leo-agent-manager:test
          build-args: VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: node tests/container-smoke.mjs
      - uses: docker/login-action@v4.6.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6.2.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v7.3.0
        id: publish
        if: github.event_name != 'pull_request'
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VCS_REF=${{ github.sha }}
          cache-from: type=gha
          provenance: mode=max
          sbom: true
      - name: Record the validated image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          mkdir -p release-evidence
          node --input-type=module <<'JS'
          import { writeFileSync } from 'node:fs'
          writeFileSync('release-evidence/image.json', JSON.stringify({ schema: 1, repository: process.env.GITHUB_REPOSITORY.toLowerCase(), commit: process.env.GITHUB_SHA, digest: process.env.IMAGE_DIGEST, runId: Number(process.env.GITHUB_RUN_ID) }))
          JS
      - uses: actions/upload-artifact@v7.0.1
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: validated-image
          path: release-evidence/image.json
          retention-days: 90
          overwrite: true
  deploy:
    if: always() && !cancelled() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.resolve.result == 'success' && (needs.resolve.outputs.reuse == 'true' || (needs.quality.result == 'success' && needs.image.result == 'success'))
    needs: [resolve, quality, image]
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ vars.LEO_PUBLIC_URL }}
    concurrency:
      group: coolify-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/setup@v2.1.0
        with:
          runtime: node@24
          require-lockfile: true
          install: false
      - uses: docker/setup-buildx-action@v4.3.0
        if: needs.resolve.outputs.reuse == 'true'
      - uses: docker/login-action@v4.6.0
        if: needs.resolve.outputs.reuse == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote the validated digest to the release tag
        if: needs.resolve.outputs.reuse == 'true'
        env:
          IMAGE_DIGEST: ${{ needs.resolve.outputs.digest }}
        run: docker buildx imagetools create --tag "ghcr.io/${GITHUB_REPOSITORY}:${GITHUB_REF_NAME#v}" "ghcr.io/${GITHUB_REPOSITORY}@${IMAGE_DIGEST}"
      - name: Deploy the published image and verify the running commit
        env:
          COOLIFY_URL: ${{ vars.COOLIFY_URL }}
          COOLIFY_SERVICE_UUID: ${{ vars.COOLIFY_SERVICE_UUID }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          LEO_PUBLIC_URL: ${{ vars.LEO_PUBLIC_URL }}
          DEPLOY_IMAGE: ghcr.io/${{ github.repository }}@${{ needs.resolve.outputs.digest || needs.image.outputs.digest }}
          DEPLOY_COMMIT: ${{ github.sha }}
        run: node scripts/deploy-coolify.mjs
