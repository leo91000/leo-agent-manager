name: Android
on:
  pull_request:
    paths: ['android/**', .github/workflows/android.yaml]
  push:
    branches: [main]
    paths: ['android/**', .github/workflows/android.yaml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v5
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Test, lint and build debug
        working-directory: android
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --no-daemon
      - name: Build optimized release
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Check conversation and model controls on Android 16
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: false
          script: |
            cd android && ./gradlew connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=dev.leo.manager.ui.HistoryFollowDeviceTest,dev.leo.manager.ui.ModelPickerDeviceTest,dev.leo.manager.ui.ClaudeDeviceTest,dev.leo.manager.ui.ModelCatalogDeviceTest --no-daemon
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb install -r -t android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            # Gradle uninstalls the test app, so regenerate both captures after reinstalling.
            adb shell am instrument -w -e class 'dev.leo.manager.ui.HistoryFollowDeviceTest#oversizedFinalMessageStillReachesTheBottomAfterStreamingAndResize,dev.leo.manager.ui.ModelPickerDeviceTest#selectionSurvivesRecreationAndModelChangeResetsEffort' dev.leo.manager.test/androidx.test.runner.AndroidJUnitRunner > android/app/build/reports/capture-instrumentation.txt
            adb exec-out run-as dev.leo.manager cat files/scroll-validation/pinned-stream.png > android/app/build/reports/pinned-stream.png
            adb exec-out run-as dev.leo.manager cat files/model-picker/reasoning.png > android/app/build/reports/reasoning-picker.png
            python3 -c 'from pathlib import Path; p = Path("android/app/build/reports"); assert "OK (2 tests)" in (p / "capture-instrumentation.txt").read_text(); assert all((p / name).read_bytes()[:8] == bytes([137, 80, 78, 71, 13, 10, 26, 10]) for name in ("pinned-stream.png", "reasoning-picker.png"))'
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: leo-android
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/reports/tests/
            android/app/build/reports/lint-results-debug.*
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
            android/app/build/reports/pinned-stream.png
            android/app/build/reports/reasoning-picker.png
            android/app/build/reports/capture-instrumentation.txt
          retention-days: 14
