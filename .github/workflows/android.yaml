name: Android
on:
  pull_request:
    paths: ['android/**', .github/workflows/android.yaml]
  push:
    branches: [main]
    paths: ['android/**', .github/workflows/android.yaml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v5
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Test, lint and build debug
        working-directory: android
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --no-daemon
      - name: Build optimized release
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Check conversation gestures on Android 16
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: false
          script: |
            cd android && ./gradlew connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=dev.leo.manager.ui.HistoryFollowDeviceTest --no-daemon
            adb exec-out run-as dev.leo.manager cat files/scroll-validation/pinned-stream.png > android/app/build/reports/pinned-stream.png
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: leo-android
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/reports/tests/
            android/app/build/reports/lint-results-debug.*
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
            android/app/build/reports/pinned-stream.png
          retention-days: 14
